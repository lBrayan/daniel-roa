name: Deploy Portfolio with CDK

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node (para pnpm/CDK)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm & aws-cdk
        run: |
          npm install -g pnpm
          npm install -g aws-cdk

      - name: Install Root Dependencies & Build App
        run: |
          bun install
          bun run build
          # Verificamos que la salida de TanStack Start exista antes de seguir
          ls -la .output/public

      - name: 🔑 Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install CDK Dependencies
        run: |
          cd infrastructure
          pnpm install

      - name: CDK Deploy
        run: |
          cd infrastructure
          cdk deploy --require-approval never